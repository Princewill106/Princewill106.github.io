# Keeps videos.json in step with the "AI Video Portfolio" Google Drive folder.
# Runs every 30 minutes (and on demand from the Actions tab). It only commits when the folder has changed.
# The folder must be shared as "Anyone with the link: Viewer". No passwords or API keys are needed.
name: Update videos from Google Drive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the Drive folder and write videos.json
        env:
          FOLDER_ID: 1jiOwE8-WoNM-DDkb4nwVYb6HH5aTkkBA
        run: |
          python3 - <<'PY'
          import json, os, re, sys, html, urllib.request
          folder = os.environ["FOLDER_ID"]
          url = f"https://drive.google.com/embeddedfolderview?id={folder}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          page = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          entry = re.compile(r'<div class="flip-entry" id="entry-([\w-]+)".*?type/([^"]+)".*?flip-entry-title">(.*?)</div>.*?flip-entry-last-modified"><div>(.*?)</div>', re.S)
          videos = [{"id": m[0], "name": html.unescape(m[2]), "modified": html.unescape(m[3])}
                    for m in entry.findall(page) if m[1].startswith("video/")]
          if not videos:
              # Never wipe the list because of a temporary Drive hiccup or a change in Drive's page.
              print("No videos found; leaving videos.json unchanged."); sys.exit(0)
          old = {}
          if os.path.exists("videos.json"):
              try: old = json.load(open("videos.json"))
              except Exception: old = {}
          if old.get("videos") == videos:
              print("No change."); sys.exit(0)
          json.dump({"folder": folder, "videos": videos}, open("videos.json", "w"), indent=2, ensure_ascii=False)
          print(f"Wrote {len(videos)} videos.")
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Update videos from Google Drive"
            git push
          fi
